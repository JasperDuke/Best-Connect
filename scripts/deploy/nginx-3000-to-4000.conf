# Optional Nginx config if you want users to hit :3000 while the Node app runs on :4000.
#
# This repo serves API + static UI from the same Node process, so you normally
# only need ONE port. Use this only if you specifically want:
#   - public URL  -> http://your-vm:3000
#   - Node/PM2    -> listens on 127.0.0.1:4000
#
# PM2: set PORT=4000 in ecosystem.config.cjs env_production, then:
#   sudo cp scripts/deploy/nginx-3000-to-4000.conf /etc/nginx/sites-available/hr-connect
#   sudo ln -s /etc/nginx/sites-available/hr-connect /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
